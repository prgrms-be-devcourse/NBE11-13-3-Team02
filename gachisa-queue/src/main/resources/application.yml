server:
  port: ${QUEUE_PORT:8081}

spring:
  application:
    name: gachisa-queue
  profiles:
    # core(gachisa-backend)와 같은 규칙. 공유 시크릿은 Git에 올리지 않는
    # application-local.yml 에 두고 이 프로파일로 읽는다. 덕분에 셸 환경변수를
    # 내보내지 않는 실행 경로(IDE 실행 버튼)에서도 뜬다. 파일이 없으면 무시된다.
    active: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

queue:
  # core(gachisa-backend)의 jwt.secret과 완전히 동일해야 한다.
  jwt-secret: ${JWT_SECRET:change-this-secret-in-local-yml}
  # core ↔ queue 서비스 간 호출에 쓰는 공유 토큰. 사용자 토큰과 용도가 다르다.
  internal-token: ${QUEUE_INTERNAL_TOKEN:local-internal-token}
  core-base-url: ${CORE_BASE_URL:http://localhost:8080}
  admission-timeout: 10m
  admission-batch-size: 10

logging:
  level:
    com.gachisa.queue: INFO
