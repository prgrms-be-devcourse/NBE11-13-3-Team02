spring:
  application:
    name: gachisa-backend

  profiles:
    active: local

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 존재하지 않는 주문을 잠금 조회한 뒤 동시에 INSERT할 때 MySQL
      # REPEATABLE_READ의 gap lock끼리 교착되는 것을 방지한다.
      transaction-isolation: TRANSACTION_READ_COMMITTED

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate   # 초기 개발 중엔 update, 이후 반드시 validate로 전환 권장
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false     # N+1/지연로딩 문제를 명확히 드러내기 위해 false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 500명의 결제 진입 요청이 동시에 도착해도, 처리 대기 중인 연결을 즉시 거절하지 않도록 합니다.
# 무제한으로 늘리지 않고 부하 테스트 목표의 2배인 1,000으로 제한합니다.
server:
  tomcat:
    accept-count: 1000

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 7d

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

payment:
  toss:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

