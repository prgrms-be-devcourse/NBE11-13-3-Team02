# 챗봇 서버 CI. core/queue 는 별도 워크플로가 필요하다.
name: chatbot

on:
  pull_request:
    paths:
      - "gachisa-chatbot/**"
      - ".github/workflows/chatbot.yml"
  push:
    branches: [main, dev]
    paths:
      - "gachisa-chatbot/**"

defaults:
  run:
    working-directory: gachisa-chatbot

jobs:
  # API 키가 없어도 도는 검사. 포크 PR 에서도 항상 실행된다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
        # Settings 는 필수값이 없으면 임포트 시점에 터진다. 로컬은 .env 로 채워지지만
        # CI 에는 파일이 없다. 테스트는 실제 값을 쓰지 않으므로 자리만 채운다.
      - run: uv run pytest -q
        env:
          JWT_SECRET: ci-placeholder-secret-at-least-64-bytes-long-for-hs512-algorithm-ok
          GEMINI_API_KEY: ci-placeholder-not-called

  # 라우팅 품질이 기준선보다 나빠졌는지 본다.
  #
  # 임베딩 모델만 쓰므로 생성 모델의 하루 20회 한도를 건드리지 않는다. 임베딩은
  # 분당 100회라 PR 하나당 5회쯤 쓰는 이 작업에는 넉넉하다.
  #
  # 시크릿이 없는 환경(포크 PR)에서는 건너뛴다. 실패시키면 외부 기여가 막히는데,
  # 정작 시크릿이 없어서 못 재는 것이지 품질이 나쁜 게 아니기 때문이다.
  routing-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups

      - name: API 키 유무 확인
        id: secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "present=${{ secrets.GEMINI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: 라우팅 기준선 검사
        if: steps.secret.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 설정은 .env 를 읽지만 CI 에는 파일이 없다. 환경변수로 넘긴다.
          JWT_SECRET: ci-placeholder-secret-not-used-by-this-check-but-required-by-settings
        run: uv run python scripts/check_router.py --check-baseline

      - name: 건너뜀 안내
        if: steps.secret.outputs.present != 'true'
        run: |
          echo "::notice::GEMINI_API_KEY 시크릿이 없어 라우팅 평가를 건너뜁니다."
          echo "리포지토리 Settings > Secrets > Actions 에 추가하면 켜집니다."
